<!-- CARRUSEL DE PELÍCULAS -->
<div class="carrusel">

    <!-- Contenedor de las imágenes -->
    <div class="carrusel-imagenes" id="carruselImagenes">

        <div class="slide">
            <img src="img/7b86f2a7e80941d97c265348873a82c73450c0286ed1d1eeb7d86440ec707de5.jpg" alt="Película destacada 1">
        </div>

        <div class="slide">
            <img src="img/23c8994d82dbe217e4227ced276e73b927aab4a5549723ce130d8defb081c7da.jpg" alt="Película destacada 2">
        </div>

        <div class="slide">
            <img src="img/poster1.jpg" alt="Película destacada 3">
        </div>

        <div class="slide">
            <img src="img/White_Chicks_Poster_Latino.webp" alt="Película destacada 3">
        </div>

    </div>

    <!-- Botón para retroceder -->
    <button class="carrusel-btn anterior" onclick="moverCarrusel(-1)">
        &#10094;
    </button>

    <!-- Botón para avanzar -->
    <button class="carrusel-btn siguiente" onclick="moverCarrusel(1)">
        &#10095;
    </button>

    <!-- Indicadores del carrusel -->
    <div class="indicadores" id="indicadores">
        <span class="punto activo" onclick="irSlide(0)"></span>
        <span class="punto" onclick="irSlide(1)"></span>
        <span class="punto" onclick="irSlide(2)"></span>
        <span class="punto" onclick="irSlide(3)"></span>
    </div>

</div>
