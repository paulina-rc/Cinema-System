<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2? family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600&display=swap">
</head>
<body>
    <div>
        <div class="logo">
            <h2>IMPERIUM Cinemas</h2>
            <a href="#cartelera" class="nav-link active">Cartelera</a>
        </div>

        <div class="cartelera-header">

    <div class="cartelera-titulos">
        <p>EN EXHIBICIÓN HOY</p>
        <h1>CARTELERA</h1>
    </div>

    <button class="btn-reservar">
        Reservar butacas
    </button>

</div>


<!-- CARRUSEL DE PELÍCULAS -->
<div class="carrusel">

    <!-- Contenedor de las imágenes -->
    <div class="carrusel-imagenes" id="carruselImagenes">

        <div class="slide">
            <img src="imagenes/pelicula1.jpg" alt="Película destacada 1">
        </div>

        <div class="slide">
            <img src="imagenes/pelicula2.jpg" alt="Película destacada 2">
        </div>

        <div class="slide">
            <img src="imagenes/pelicula3.jpg" alt="Película destacada 3">
        </div>

    </div>

    <!-- Botón para retroceder -->
    <button class="carrusel-btn anterior" onclick="moverCarrusel(-1)">
        &#10094;
    </button>

    <!-- Botón para avanzar -->
    <button class="carrusel-btn siguiente" onclick="moverCarrusel(1)">
        &#10095;
    </button>

    <!-- Indicadores del carrusel -->
    <div class="indicadores" id="indicadores">
        <span class="punto activo" onclick="irSlide(0)"></span>
        <span class="punto" onclick="irSlide(1)"></span>
        <span class="punto" onclick="irSlide(2)"></span>
    </div>

</div>


<div class="peliculas-container">

    <div class="pelicula">
        <div class="poster">
            PÓSTER
        </div>

        <div class="pelicula-info">
            <h3>[Película 1]</h3>
        </div>
    </div>

    <div class="pelicula">
        <div class="poster">PÓSTER</div>
        <div class="pelicula-info">
            <h3>[Película 2]</h3>
        </div>
    </div>

    <div class="pelicula">
        <div class="poster">PÓSTER</div>
        <div class="pelicula-info">
            <h3>[Película 3]</h3>
        </div>
    </div>

    <div class="pelicula">
        <div class="poster">PÓSTER</div>
        <div class="pelicula-info">
            <h3>[Película 4]</h3>
        </div>
    </div>

</div>

    </div>
</body>
</html>
