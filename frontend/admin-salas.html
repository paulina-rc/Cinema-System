<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar salas | Cinema System</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Cinema System</a>
    <nav aria-label="Administracion">
      <a href="admin-peliculas.html">Peliculas</a>
      <a href="admin-salas.html" aria-current="page">Salas</a>
    </nav>
  </header>
  <main class="container">
    <h1>Administrar salas</h1>
    <p id="admin-salas-estado" role="status"></p>
    <form id="form-sala">
      <label>Nombre <input name="nombre" required maxlength="100"></label>
      <label>Agrupaciones <input name="agrupaciones" type="number" min="1" required></label>
      <label>Butacas por agrupacion <input name="butacas_por_agrupacion" type="number" min="1" required></label>
      <button type="submit">Crear sala</button>
    </form>
    <h2>Salas</h2>
    <div id="salas-lista"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/admin-salas.js"></script>
</body>
</html>
